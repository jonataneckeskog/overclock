name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Build Core Workspace
      run: cargo build --workspace --exclude car-drive --exclude test-downstream --verbose
    - name: Run tests
      run: cargo test --workspace --exclude car-drive --exclude test-downstream --verbose
